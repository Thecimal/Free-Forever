[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qs-ai-orchestrator"
version = "0.1.0"
description = "Local orchestration layer combining browser-based AI, free APIs, and local models into one compute pool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "thecimal", email = "behnoud.mhm@gmail.com" }
]
keywords = [
    "ai",
    "orchestrator",
    "llm",
    "omniroute",
    "ollama",
    "fallback",
    "parallel",
    "synthesis",
    "local-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Thecimal/Free-Forever"
Repository = "https://github.com/Thecimal/Free-Forever"
Issues = "https://github.com/Thecimal/Free-Forever/issues"
Documentation = "https://github.com/Thecimal/Free-Forever#readme"

[project.scripts]
qs-orchestrator = "qs_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


